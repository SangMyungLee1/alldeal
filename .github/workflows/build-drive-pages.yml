name: Build drive SEO pages

on:
  push:
    branches:
      - agent/drive-seo-content
    paths:
      - scripts/drive_builder_sources.tar.gz
      - .github/workflows/build-drive-pages.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: agent/drive-seo-content
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore readable generator sources
        run: tar -xzf scripts/drive_builder_sources.tar.gz

      - name: Generate regional guide pages
        run: python scripts/drive_builder/build_drive_pages.py

      - name: Validate generated output
        shell: bash
        run: |
          test "$(find misc/drive -maxdepth 1 -name '*.html' | wc -l)" -ge 55
          test -f misc/drive/index.html
          test -f misc/drive/sitemap.xml
          grep -q 'noindex,follow' misc/drive/성인가대리운전.html
          ! grep -R -E '010-0000-0000|>NO\.1<|15,000\+|>98%<' misc/drive --include='*.html'
          grep -q 'misc/drive/sitemap.xml' robots.txt

      - name: Remove one-time source bundle
        run: rm scripts/drive_builder_sources.tar.gz

      - name: Commit generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/drive_builder misc/drive robots.txt scripts/drive_builder_sources.tar.gz
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "대리운전 지역 가이드 SEO 구조 개선 [skip ci]"
          git push origin HEAD:agent/drive-seo-content
